# canadaLight — modal machine preset (full turbine runner geometry).
#
# Only modal-physics data lives here.  Geometry export (dtOO), design
# parameters and CFD belong to the caller.
name: canadaLight

material:
  youngs_modulus: 210.0e9
  density: 7850.0
  poisson_ratio: 0.30

solver:
  num_eigenvalues: 10
  tolerance: 1.0e-6
  freq_min: 0.0
  freq_max: 2000.0
  element_degree: 2
  solver_backend: scipy

# No clamp — free-free modal analysis.
bc_template:
  type: free_free

axis: auto
mesh_scale_factor: 1.0

resonance:
  Z_guidevanes: 18
  max_harmonic: 6
  margin_hz: 5.0
  margin_fraction: 0.05
  penalty_k: 1.0
