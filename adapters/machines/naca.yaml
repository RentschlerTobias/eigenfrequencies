# naca — 2-D NACA00xx foil validation preset (foil-root clamp).
#
# NOTE: the naca dtOO case defines only fluid channel grids (hexahedra mixed
# with prisms); dolfinx refuses a function space on that mixed-topology mesh.
# A modal run therefore needs a tetrahedral mechanical volume added to the dtOO
# case first.  This preset is kept for config-level validation only.
name: naca

material:
  youngs_modulus: 210.0e9
  density: 7850.0
  poisson_ratio: 0.30

solver:
  num_eigenvalues: 10
  tolerance: 1.0e-6
  freq_min: 0.0
  freq_max: 2000.0
  element_degree: 2
  solver_backend: scipy

# Axial-plane clamp at the foil root.
bc_template:
  type: foil_clamp

axis: auto
mesh_scale_factor: 1.0

resonance:
  Z_guidevanes: 18
  max_harmonic: 6
  margin_hz: 5.0
  margin_fraction: 0.05
  penalty_k: 1.0
