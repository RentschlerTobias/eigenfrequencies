# Tistos runner — modal machine preset.
#
# Only modal-physics data lives here: material, boundary condition, rotation
# axis, coordinate scale and resonance bands.  Geometry export (dtOO), design
# parameters and CFD belong to the caller.
name: tistos

# Isotropic material for the runner solid.
material:
  youngs_modulus: 210.0e9
  density: 7850.0
  poisson_ratio: 0.30

# Modal eigensolver settings.
solver:
  num_eigenvalues: 10
  tolerance: 1.0e-6
  freq_min: 0.0
  freq_max: 2000.0
  element_degree: 2
  solver_backend: scipy

# Boundary condition — hub-bore clamp on the z=0 plane (hub_center, hub_radius).
bc_template:
  type: hub_clamp
  params:
    hub_center: [0.0, 0.0]
    hub_radius: 0.15
    axial_min: null
    axial_max: null

# Rotation axis: "auto" discovers it from the mesh bounding box; explicit
# override is a [x, y, z] 3-vector.
axis: auto

# Coordinate scale factor: multiply mesh coordinates by this so the scaled mesh
# has hub_radius ~ 0.15 m.  1.0 = dtOO native units (physical).
mesh_scale_factor: 1.0

# Forbidden-band definition (blade-passing-frequency resonance).  n_rpm is NOT
# stored here — it is supplied per evaluation via the overrides.
resonance:
  Z_guidevanes: 18
  max_harmonic: 6
  margin_hz: 5.0
  margin_fraction: 0.05
  penalty_k: 1.0
