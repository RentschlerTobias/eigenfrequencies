[project]
name = "eigenfrequencies"
version = "0.1.0"
description = "Framework for optimizing eigenfrequencies of hydraulic machine components"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "IHS University of Stuttgart"}
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "cma>=4.4.4",
    "gymnasium>=1.3.0",
    "pymoo>=0.6.2",
    "pyyaml>=6.0.3",
    "typer>=0.12.0",
]

[project.scripts]
eigenfrequencies = "eigenfrequencies.cli:app"
eigenfrequencies-mcp = "eigenfrequencies.mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "jsonschema",
    "ruff",
]
optimize = [
    "optuna>=4.9.0",
    "pymoo",
    "cma",
]
rl = [
    "gymnasium",
    "stable-baselines3",
    "d3rlpy",
]
mcp = [
    "fastmcp",
    "jsonschema",
]
dtoo = [
    "Pyro5",
]
hydroflow = [
    "hydroflow-opt",
]

# Cases discovered by hydroflow-opt. One class per machine YAML; see
# eigenfrequencies.hydroflow.case.MachineCasePlugin.
[project.entry-points."hydroflow_opt.cases"]
tistos = "eigenfrequencies.hydroflow.case:TistosCase"
naca = "eigenfrequencies.hydroflow.case:NacaCase"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = [
    "turbine_runner/",
    "demo/",
    "docs/",
    "dtOO/",
    "examples/",
    ".venv/",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E402",   # module import not at top — legitimate in schema/test conditional imports
    "E501",   # line too long
    "E741",   # ambiguous variable names (l, O, I) — common in FEM/math
    "E712",   # == True/False — common in numpy mask code
    "F401",   # unused import — many are re-exports
    "F841",   # local variable unused — common in tests
]

[tool.pytest.ini_options]
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_container: marks tests that need a docker container",
    "requires_dtoo: marks tests that need the dtOO environment",
    "requires_slurm: marks tests that need SLURM cluster access",
    "serial: marks tests that must run serially (no parallel execution)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
