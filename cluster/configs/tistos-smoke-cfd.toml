# tistos — cfd_only smoke. Two explicit candidates through dtOO export +
# simpleFoam on dev_cpu_il, proving mpi_launcher=mpirun and the OMPI root env
# before any production queue. tistos-smoke.toml covers the resonance chain;
# this is the second job it asks for, and the one that historically broke.
#
#   sbatch --partition=dev_cpu_il --time=00:30:00 \
#          cluster/submit_hydroflow_opt.sh cluster/configs/tistos-smoke-cfd.toml
#
# The candidates below are byte-for-byte the ones in tistos-smoke.toml, so the
# two smokes are directly comparable candidate by candidate.

[run]
directory = "$WS/runs/tistos-smoke-cfd"

[case]
name = "tistos"

[case.options]
local_scratch = "$TMPDIR"
eval_mode = "cfd_only"
n_rpm = 72.0

[case.options.dtoo]
runtime = "enroot"
container = "dtOO"
case_dir = "/dtOO/build/test/tistos"
timeout = 1800

[case.options.cfd]
# The two lines this smoke exists to prove: the container has only mpirun, and
# OpenMPI refuses to run as root — which is the only way enroot can run it.
timeout = 3600
mpi_launcher = "mpirun"
env = { OMPI_ALLOW_RUN_AS_ROOT = "1", OMPI_ALLOW_RUN_AS_ROOT_CONFIRM = "1" }

[resources]
# dev_cpu_il: 64 cores. 2 concurrent x 6 ranks x 1 thread = 12 — the dtOO
# export is single-threaded gmsh, the ranks serve simpleFoam.
available_cpus = 64
concurrent_evaluations = 2
mpi_ranks = 6
threads_per_rank = 1

# The labels carry dots, so every key has to be quoted: TOML would
# otherwise read cV_ru_t_le_a_0.5 as a nested key under cV_ru_t_le_a_0
# and fail with "Cannot overwrite a value".

[[candidate]]
id = "baseline"
[candidate.parameters]
