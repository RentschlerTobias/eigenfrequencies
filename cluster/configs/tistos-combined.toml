# tistos — CFD + resonance. Run last: the most expensive per candidate, and the
# one whose result the other two explain.
#
# Objective = cfd_scalar + w_resonance × resonance_penalty. The resonance term
# is a soft constraint: zero unless a mode sits inside the forbidden band.
#
# Submit with:  sbatch cluster/submit_hydroflow_opt.sh cluster/configs/tistos-combined.toml
# See cluster/configs/README.md for the shared settings and the open SLEPc question.

[run]
# [USER] Set an absolute workspace path. A relative one is resolved against
# *this file's* directory, so the default writes into the repo checkout.
directory = "$WS/runs/tistos-combined"

[case]
name = "tistos"

[case.options]
# Heavy artifacts (21 MB mesh, decomposed OpenFOAM case) onto node-local NVMe.
# The orchestrator's own scratch stays on the workspace so `resume` can reuse
# finished evaluations — see cluster/submit_hydroflow_opt.sh.
local_scratch = "$TMPDIR"
# The one line that differs between the three runs.
eval_mode = "combined"
n_rpm = 72.0

[case.options.dtoo]
runtime = "enroot"
container = "dtOO"
case_dir = "/dtOO/build/test/tistos"
timeout = 1800

[case.options.modal]
runtime = "enroot"
# Stock dolfinx from Docker Hub; gmsh comes from a mounted pip --target dir.
# See cluster/enroot_fenicsx_import.md — no image has to be built or copied.
container = "dolfinx"
# [USER] python3 -m pip install --target ~/pylibs gmsh   (login node)
pythonpath = ["$HOME/pylibs"]
timeout = 7200

[case.options.modal.solver]
# P2 per Q6, SLEPc as the plan intended. Both backends handle the hub clamp
# and agree to machine precision (tests/solver/test_backend_equivalence.py);
# SLEPc keeps the matrices sparse, which is what decides whether 545k DOFs fit.
# Switch to "scipy" if MUMPS turns out to be the memory problem rather than the
# solution — the physics does not change either way.
element_degree = 2
solver_backend = "slepc"
num_eigenvalues = 10

[case.options.cfd]
# Same native-on-host pattern as tistos-cfd-only.toml (proven by smoke job
# 6819840): host openmpi from the module dependencies provides mpiexec, runs as
# the normal user, so no OMPI_ALLOW_RUN_AS_ROOT env. The module only sets
# $FOAM_INIT, and foamInit is absent from PATH after a bare module load, hence
# the fallback (probe: cluster/logs/6819095/diagnosis/).
runtime = "native"
setup = [
    "module load cae/openfoam/v2412",
    "command -v foamInit >/dev/null && foamInit || source $FOAM_INIT",
]
timeout = 3600
mpi_launcher = "mpiexec"

[case.options.optimization]
Z_guidevanes = 18
max_harmonic = 6
margin_hz = 5.0
margin_fraction = 0.05

[case.options.objective]
# Weights on the three hydraulic terms plus the resonance constraint. Changing
# any of these makes the run incomparable to the other two.
w_eta = 1.0
w_cav = 1.0
w_head = 1.0
w_resonance = 1.0

[resources]
# cpu_il partition: 64 cores, 256 GiB. Sized from the per-stage measurement of
# tistos-combined-dev, which is the only run that ever timed a whole combined
# candidate:
#
#   cfd_build  224.1 s   single-threaded dtOO/gmsh — ignores mpi_ranks
#   cfd_solve  134.5 s   simpleFoam                — scales with mpi_ranks
#   mesh       371.0 s   single-threaded gmsh      — ignores both
#   modal      265.1 s   MUMPS                     — scales with threads
#   total      995.3 s
#
# 134.5 of 995 s — 13.5% — is all that responds to mpi_ranks, so concurrency is
# the lever and ranks are not. Threads are a weak lever too: the modal solve
# measured 265 s at 1 thread against 179 s at 6 (freq-only dev run), 1.48x for
# six times the cores.
#
# 16 x 4 x 1 = 64 cores exactly. Memory: 16 concurrent modal solves at ~11 GB
# is 176 GB of 251 GiB, so memory still does not bind — but it is now the
# constraint that caps concurrency rather than the core count.
# See docs/cluster-resource-sizing.md.
#
# mpi_ranks must stay identical to tistos-cfd-only.toml — it decides the
# decomposePar partitioning and therefore the CFD numbers.
available_cpus = 64
concurrent_evaluations = 16
mpi_ranks = 4
threads_per_rank = 1

[optimization]
# Identical in all three configs. Sized for the problem, not for a walltime:
# a job killed at 48 h is resumed by the next one from its last checkpoint, and
# every finished evaluation is reused rather than recomputed.
#
# 30 design parameters. Differential evolution wants a population of roughly
# 5-10x the dimension; 8 individuals could not form meaningful difference
# vectors and would converge on the initial population rather than the
# objective. 60 is 2x the dimension — still lean, but a different regime.
#
# 24 generations: sized to outlast the 48 h walltime at 16 concurrent
# evaluations (415 s per candidate measured at concurrency 2, 500-900 s
# expected at 16x, the modal solves add more on top). A walltime kill costs
# only the generation in progress; resume reuses every finished evaluation.
# Total evaluations = islands × population_size × (generations + 1)
#                   = 4 × 60 × 25 = 6000.
#
# tistos-cfd-only.toml is submitted with the generation count this run actually
# reached, so the two runs compare at equal search depth.
islands = 4
population_size = 60
generations = 24
differential_weight = 0.8
crossover_rate = 0.9
seed = 20260911
