# tistos — CFD + resonance. Run last: the most expensive per candidate, and the
# one whose result the other two explain.
#
# Objective = cfd_scalar + w_resonance × resonance_penalty. The resonance term
# is a soft constraint: zero unless a mode sits inside the forbidden band.
#
# Submit with:  sbatch cluster/submit_hydroflow_opt.sh cluster/configs/tistos-combined.toml
# See cluster/configs/README.md for the shared settings and the open SLEPc question.

[run]
# [USER] Set an absolute workspace path. A relative one is resolved against
# *this file's* directory, so the default writes into the repo checkout.
directory = "$WS/runs/tistos-combined"

[case]
name = "tistos"

[case.options]
# Heavy artifacts (21 MB mesh, decomposed OpenFOAM case) onto node-local NVMe.
# The orchestrator's own scratch stays on the workspace so `resume` can reuse
# finished evaluations — see cluster/submit_hydroflow_opt.sh.
local_scratch = "$TMPDIR"
# The one line that differs between the three runs.
eval_mode = "combined"
n_rpm = 72.0

[case.options.dtoo]
runtime = "enroot"
container = "$ENROOT_IMAGES/dtOO.sqsh"
case_dir = "/dtOO/build/test/tistos"
timeout = 1800

[case.options.modal]
runtime = "enroot"
# Stock dolfinx from Docker Hub; gmsh comes from a mounted pip --target dir.
# See cluster/enroot_fenicsx_import.md — no image has to be built or copied.
container = "$ENROOT_IMAGES/dolfinx.sqsh"
# [USER] python3 -m pip install --target ~/pylibs gmsh   (login node)
pythonpath = ["$HOME/pylibs"]
timeout = 7200

[case.options.modal.solver]
# P2 per Q6, SLEPc as the plan intended. Both backends handle the hub clamp
# and agree to machine precision (tests/solver/test_backend_equivalence.py);
# SLEPc keeps the matrices sparse, which is what decides whether 545k DOFs fit.
# Switch to "scipy" if MUMPS turns out to be the memory problem rather than the
# solution — the physics does not change either way.
element_degree = 2
solver_backend = "slepc"
num_eigenvalues = 10

[case.options.cfd]
timeout = 3600

[case.options.optimization]
Z_guidevanes = 18
max_harmonic = 6
margin_hz = 5.0
margin_fraction = 0.05

[case.options.objective]
# Weights on the three hydraulic terms plus the resonance constraint. Changing
# any of these makes the run incomparable to the other two.
w_eta = 1.0
w_cav = 1.0
w_head = 1.0
w_resonance = 1.0

[resources]
# cpu partition: AMD EPYC 9454, 96 cores, 384 GiB. The binding factor is
# neither memory nor threads but concurrency: the dtOO export is single-threaded
# gmsh and appears to dominate an evaluation, so extra threads per candidate sit
# idle through it. 16 concurrent x ~10 GB is 160 GB of 384, with room to spare.
available_cpus = 96
concurrent_evaluations = 16
mpi_ranks = 6
threads_per_rank = 1

[optimization]
# Identical in all three configs. Sized for the problem, not for a walltime:
# a job killed at 48 h is resumed by the next one from its last checkpoint, and
# every finished evaluation is reused rather than recomputed.
#
# 30 design parameters. Differential evolution wants a population of roughly
# 5-10x the dimension; 8 individuals could not form meaningful difference
# vectors and would converge on the initial population rather than the
# objective. 60 is 2x the dimension — still lean, but a different regime.
#
# Total evaluations = islands × population_size × (generations + 1)
#                   = 4 × 60 × 13 = 3120.
islands = 4
population_size = 60
generations = 12
differential_weight = 0.8
crossover_rate = 0.9
seed = 20260911
