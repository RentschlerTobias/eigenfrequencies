# tistos — 30-minute cluster smoke test. NOT one of the three comparison runs.
#
# Two explicit candidates through the full modal chain, sized for a dev_cpu_il
# node (64 cores, 256 GB, 30 min walltime). Its purpose is to shake out the
# cluster path *before* committing to a production queue, where a 24-48 h job
# waits 5-7 days — realistically one attempt before the deadline.
#
#   sbatch --partition=dev_cpu_il --time=00:30:00 \
#          cluster/submit_hydroflow_opt.sh cluster/configs/tistos-smoke.toml
#
# The submit script detects explicit candidates and calls `hydroflow-opt run`,
# which evaluates exactly these two designs and stops. No optimization table.
#
# The same two designs ran locally on 2026-08-28, so the numbers are directly
# comparable: the geometry export produced a 21.8 MB mesh for baseline and
# 23.8 MB for midpoint (different md5), and MUMPS factored the P2 system in
# 209 s on two cores. What this run adds is the enroot path and real timings —
# which is what the production walltime has to be based on.
#
# resonance_only, not cfd_only: no simpleFoam, so it comfortably fits 30 min.
# Run a cfd_only variant as a second job — that is the one that historically
# broke, and there are idle nodes to do both at once.

[run]
# [USER] Absolute workspace path. A relative one resolves against this file.
directory = "$WS/runs/tistos-smoke"

[case]
name = "tistos"

[case.options]
# Heavy artifacts (21 MB mesh, decomposed OpenFOAM case) onto node-local NVMe.
# The orchestrator's own scratch stays on the workspace so `resume` can reuse
# finished evaluations — see cluster/submit_hydroflow_opt.sh.
local_scratch = "$TMPDIR"
eval_mode = "resonance_only"
n_rpm = 72.0

[case.options.dtoo]
runtime = "enroot"
container = "dtOO"
case_dir = "/dtOO/build/test/tistos"
timeout = 3600

[case.options.modal]
runtime = "enroot"
# The STOCK dolfinx image, imported straight from Docker Hub — no build, no
# push, no 1.6 GB copy. It lacks gmsh, so the modal stage cannot read a mesh in
# it; the directory below supplies gmsh in 17 MB from the shared filesystem and
# is mounted automatically. Verified to return frequencies identical to the
# custom-built image.
container = "dolfinx"
# [USER] python3 -m pip install --target ~/pylibs gmsh   (on the login node)
pythonpath = ["$HOME/pylibs"]
timeout = 1200

[case.options.modal.solver]
element_degree = 2
solver_backend = "slepc"
num_eigenvalues = 10

[case.options.optimization]
Z_guidevanes = 18
max_harmonic = 6
margin_hz = 5.0
margin_fraction = 0.05

[resources]
# [USER] dev_cpu_il: 64 cores, 256 GB. Memory does not bind at ~10 GB per modal
# solve; the cores do — 2 × 1 × 32 = 64.
available_cpus = 64
concurrent_evaluations = 2
mpi_ranks = 1
threads_per_rank = 32

# The labels carry dots, so every key has to be quoted: TOML would
# otherwise read cV_ru_t_le_a_0.5 as a nested key under cV_ru_t_le_a_0
# and fail with "Cannot overwrite a value".

[[candidate]]
id = "baseline"
[candidate.parameters]
