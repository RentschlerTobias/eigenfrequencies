# tistos — CFD only. Run this one FIRST: cheapest of the three (no modal
# solve) and the one that proves the CFD objective varies between designs.
#
# Submit with:  sbatch cluster/submit_hydroflow_opt.sh cluster/configs/tistos-cfd-only.toml
# See cluster/configs/README.md for the shared settings and the open SLEPc question.

[run]
# [USER] Set an absolute workspace path. A relative one is resolved against
# *this file's* directory, so the default writes into the repo checkout.
# The scratch directory is redirected to node-local $TMPDIR by the submit script.
directory = "$WS/runs/tistos-cfd-only"

[case]
name = "tistos"

[case.options]
# Heavy artifacts (21 MB mesh, decomposed OpenFOAM case) onto node-local NVMe.
# The orchestrator's own scratch stays on the workspace so `resume` can reuse
# finished evaluations — see cluster/submit_hydroflow_opt.sh.
local_scratch = "$TMPDIR"
# The one line that differs between the three runs.
eval_mode = "cfd_only"
n_rpm = 72.0

[case.options.dtoo]
# A container NAME, not a path to a .sqsh: the submit script unpacks the images
# with `enroot create` because mounting them through squashfuse decompresses
# every read in one userspace process — dtOO's CreateStates went from 8 seconds
# to over 20 minutes. Explicit runtime because auto-detection falls back to
# docker, which does not exist on a compute node.
runtime = "enroot"
container = "dtOO"
case_dir = "/dtOO/build/test/tistos"
timeout = 1800

[case.options.cfd]
# procs is left unset on purpose: the worker then takes resources.mpi_ranks,
# which is the number hydroflow-opt validated against the CPU budget.
timeout = 3600
# The solve script defaults to ${MPI_LAUNCHER:-mpiexec}, and the dtOO container
# has only mpirun (openmpi4) — without this line the CFD stage fails instantly.
# enroot cannot drop privileges, so the container runs as root and OpenMPI
# refuses to launch until both variables say it may.
mpi_launcher = "mpirun"
env = { OMPI_ALLOW_RUN_AS_ROOT = "1", OMPI_ALLOW_RUN_AS_ROOT_CONFIRM = "1" }

[resources]
# cpu partition: AMD EPYC 9454, 96 cores, 384 GiB. The binding factor is
# neither memory nor threads but concurrency: the dtOO export is single-threaded
# gmsh and appears to dominate an evaluation, so extra threads per candidate sit
# idle through it. 16 concurrent x ~10 GB is 160 GB of 384, with room to spare.
available_cpus = 96
concurrent_evaluations = 16
mpi_ranks = 6
threads_per_rank = 1

[optimization]
# Identical in all three configs. Sized for the problem, not for a walltime:
# a job killed at 48 h is resumed by the next one from its last checkpoint, and
# every finished evaluation is reused rather than recomputed.
#
# 30 design parameters. Differential evolution wants a population of roughly
# 5-10x the dimension; 8 individuals could not form meaningful difference
# vectors and would converge on the initial population rather than the
# objective. 60 is 2x the dimension — still lean, but a different regime.
#
# Total evaluations = islands × population_size × (generations + 1)
#                   = 4 × 60 × 13 = 3120.
islands = 4
population_size = 60
generations = 12
differential_weight = 0.8
crossover_rate = 0.9
seed = 20260911
