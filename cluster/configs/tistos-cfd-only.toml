# tistos — CFD only. Run this one FIRST: cheapest of the three (no modal
# solve) and the one that proves the CFD objective varies between designs.
#
# Submit with:  sbatch cluster/submit_hydroflow_opt.sh cluster/configs/tistos-cfd-only.toml
# See cluster/configs/README.md for the shared settings and the open SLEPc question.

[run]
# [USER] Set an absolute workspace path. A relative one is resolved against
# *this file's* directory, so the default writes into the repo checkout.
# The scratch directory is redirected to node-local $TMPDIR by the submit script.
directory = "$WS/runs/tistos-cfd-only"

[case]
name = "tistos"

[case.options]
# Heavy artifacts (21 MB mesh, decomposed OpenFOAM case) onto node-local NVMe.
# The orchestrator's own scratch stays on the workspace so `resume` can reuse
# finished evaluations — see cluster/submit_hydroflow_opt.sh.
local_scratch = "$TMPDIR"
# The one line that differs between the three runs.
eval_mode = "cfd_only"
n_rpm = 72.0

[case.options.dtoo]
# A container NAME, not a path to a .sqsh: the submit script unpacks the images
# with `enroot create` because mounting them through squashfuse decompresses
# every read in one userspace process — dtOO's CreateStates went from 8 seconds
# to over 20 minutes. Explicit runtime because auto-detection falls back to
# docker, which does not exist on a compute node.
runtime = "enroot"
container = "dtOO"
case_dir = "/dtOO/build/test/tistos"
timeout = 1800

[case.options.cfd]
# Native on the host, mirroring the proven smoke pattern
# (cluster/configs/tistos-smoke-cfd-native.toml, job 6819840: 2/2 success).
# The module only sets $FOAM_INIT; the binaries appear after OpenFOAM is
# initialized. foamInit is the documented command but is absent from PATH after
# a bare module load (probe: cluster/logs/6819095/diagnosis/), hence the
# fallback. The host openmpi from the module dependencies provides mpiexec and
# runs as the normal user, so unlike the container setup no
# OMPI_ALLOW_RUN_AS_ROOT env is needed.
runtime = "native"
setup = [
    "module load cae/openfoam/v2412",
    "command -v foamInit >/dev/null && foamInit || source $FOAM_INIT",
]
# procs is left unset on purpose: the worker then takes resources.mpi_ranks,
# which is the number hydroflow-opt validated against the CPU budget.
timeout = 3600
mpi_launcher = "mpiexec"

[resources]
# cpu_il partition: 64 cores, 256 GiB (bwUniCluster 3.0 hardware page — the
# 96-core EPYC 9454 nodes belong to the plain cpu partition).
#
# Sized from measurement, not from the intuition that OpenFOAM parallelises
# well. It does — but it is a small part of a candidate. Job 6844xxx
# (tistos-combined-dev, one candidate) split the stage for the first time:
#
#   cfd_build  224.1 s   single-threaded dtOO/gmsh — ignores mpi_ranks
#   cfd_solve  134.5 s   simpleFoam                — scales with mpi_ranks
#
# Only 13.5% of a 995 s combined candidate responds to more ranks at all, so
# ranks buy little and concurrency buys a lot. The mesh is ~60k cells: at the
# previous 6 ranks that is 10k cells/rank, already the lower edge of where
# OpenFOAM scales, and more ranks would divide it further.
#
# 16 x 4 x 1 = 64 cores exactly, against 10 x 6 x 1 = 60 before, and roughly
# 1.5x the throughput. See docs/cluster-resource-sizing.md.
#
# mpi_ranks must stay identical to tistos-combined.toml: it decides the
# decomposePar partitioning and therefore the CFD numbers, and the two runs are
# only comparable while it matches.
available_cpus = 64
concurrent_evaluations = 16
mpi_ranks = 4
threads_per_rank = 1

[optimization]
# Identical in all three configs. Sized for the problem, not for a walltime:
# a job killed at 48 h is resumed by the next one from its last checkpoint, and
# every finished evaluation is reused rather than recomputed.
#
# 30 design parameters. Differential evolution wants a population of roughly
# 5-10x the dimension; 8 individuals could not form meaningful difference
# vectors and would converge on the initial population rather than the
# objective. 60 is 2x the dimension — still lean, but a different regime.
#
# 24 generations, mirrored from tistos-combined.toml so the runs compare at
# equal search depth: cfd-only is submitted with the generation count combined
# actually reached in its 48 h window (set to that count before submitting).
# Total evaluations = islands × population_size × (generations + 1)
#                   = 4 × 60 × 25 = 6000.
islands = 4
population_size = 60
generations = 24
differential_weight = 0.8
crossover_rate = 0.9
seed = 20260911
